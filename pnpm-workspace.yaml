allowBuilds:
  "@posthog/cli": true
  core-js: false
  esbuild: true
  lightningcss: true
catalog:
  # Keep Vitest packages at the version required by vite-plus.
  "@vitest/browser-playwright": 5.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
minimumReleaseAgeExclude:
  - postcss@8.5.32
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
